# Gera a cobrinha com as SUAS contribuições e publica no branch "output".
# Depois do primeiro push: aba Actions > "Snake" > Run workflow.
name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#136ED6&color_dots=#EBEDF0,#C6DBF7,#8AB6F0,#4A8FE6,#136ED6
            dist/snake-dark.svg?palette=github-dark&color_snake=#5DB7FF&color_dots=#161B22,#0E2A4F,#13427D,#1F63B8,#2379E8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
