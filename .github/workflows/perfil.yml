# Gera a cobrinha e o card de estatísticas do perfil e publica no branch "output".
# Roda todo dia, a cada push na main e manualmente (Actions > Perfil > Run workflow).
name: Perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Estatísticas
        run: python stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#136ED6&color_dots=#EBEDF0,#C6DBF7,#8AB6F0,#4A8FE6,#136ED6
            dist/snake-dark.svg?palette=github-dark&color_snake=#5DB7FF&color_dots=#161B22,#0E2A4F,#13427D,#1F63B8,#2379E8

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
